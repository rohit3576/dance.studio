<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viewport QA</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        align-items: flex-start;
        justify-content: center;
        padding: 20px;
        background: #111;
        color: #aaa;
        font: 12px ui-monospace, SFMono-Regular, Consolas, monospace;
      }

      .device {
        overflow: hidden;
        border: 1px solid #333;
        background: #000;
        transform-origin: top left;
      }

      .desktop {
        width: 1920px;
        height: 1080px;
        transform: scale(0.34);
      }

      .desktop-wrap {
        width: 653px;
        height: 367px;
      }

      .laptop {
        width: 1440px;
        height: 900px;
        transform: scale(0.44);
      }

      .laptop-wrap {
        width: 634px;
        height: 396px;
      }

      .tablet {
        width: 820px;
        height: 1180px;
        transform: scale(0.42);
      }

      .tablet-wrap {
        width: 344px;
        height: 496px;
      }

      .mobile {
        width: 390px;
        height: 844px;
      }

      .label {
        margin-bottom: 8px;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="label">Desktop - 1920x1080</div>
      <div class="desktop-wrap"><div class="device desktop"><iframe src="/#home"></iframe></div></div>
    </div>
    <div>
      <div class="label">Laptop - 1440x900</div>
      <div class="laptop-wrap"><div class="device laptop"><iframe src="/#home"></iframe></div></div>
    </div>
    <div>
      <div class="label">Tablet - 820x1180</div>
      <div class="tablet-wrap"><div class="device tablet"><iframe src="/#home"></iframe></div></div>
    </div>
    <div>
      <div class="label">Mobile - 390x844</div>
      <div class="device mobile"><iframe src="/#home"></iframe></div>
    </div>
  </body>
</html>
