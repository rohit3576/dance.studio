<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viewport QA</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        gap: 24px;
        align-items: flex-start;
        justify-content: center;
        padding: 20px;
        background: #111;
        color: #aaa;
        font: 12px ui-monospace, SFMono-Regular, Consolas, monospace;
      }

      .device {
        overflow: hidden;
        border: 1px solid #333;
        background: #000;
      }

      .iphone {
        width: 390px;
        height: 844px;
      }

      .android {
        width: 360px;
        height: 740px;
      }

      .label {
        margin-bottom: 8px;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="label">iPhone 12/13 - 390x844</div>
      <div class="device iphone"><iframe src="/#home"></iframe></div>
    </div>
    <div>
      <div class="label">Low Android - 360x740</div>
      <div class="device android"><iframe src="/#home"></iframe></div>
    </div>
  </body>
</html>
